name: Test

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # @cultpodcasts/contracts is a private GitHub Packages package published from RedditPodcastPoster
      # (.npmrc). This repo's GITHUB_TOKEN cannot read it: NODE_AUTH_TOKEN is a PAT with read:packages.
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=npm ci::Repository secret NODE_AUTH_TOKEN (GitHub PAT with read:packages) is not set; it is needed to install @cultpodcasts/contracts from npm.pkg.github.com."
            exit 1
          fi
          npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run lint
