# Terraform for the search platform D1 databases (SP-1.10, cultpodcasts/Api#270).
#
#   PR:   fmt + validate (no secrets); plan + plan guard + sticky plan comment (secrets only).
#   main: re-plan, plan guard, then apply behind the `cloudflare-production` environment
#         approval, then D1 schema migrations (preview first, then production).
#
# Safe before setup: with the secrets missing, the secret-dependent jobs are skipped and the
# run stays green. Apply also stays skipped until the environment has required reviewers.
# There is deliberately no destroy path anywhere in this workflow.
#
# Conventions follow cultpodcasts/freedomtimes: state in HCP Terraform (organisation and
# workspace set once, in the cloud {} block of infra/terraform/search-d1/versions.tf;
# Execution Mode: Local), HCP auth via TF_TOKEN_APP_TERRAFORM_IO, Cloudflare credentials as
# TF_VAR_* from GitHub secrets. Local execution keeps a saved plan for the plan guard.
#
# Two Cloudflare tokens, neither the repo's broader CLOUDFLARE_API_TOKEN:
#   TF_PLAN_CLOUDFLARE_API_TOKEN   repo secret, D1 Read: plans on PRs and main. A PR branch
#                                  can run its own config/workflow with it, so it cannot write.
#   TF_APPLY_CLOUDFLARE_API_TOKEN  environment secret on cloudflare-production, D1 Edit:
#                                  released only to the approved apply job on main.
name: Terraform (search D1)

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "workers/search/migrations/**"
      - ".github/workflows/terraform-search-d1.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "workers/search/migrations/**"
      - ".github/workflows/terraform-search-d1.yml"
  # Manual run on main, e.g. the first apply after the secrets are created. Still gated by
  # the environment approval and the plan guard.
  workflow_dispatch:
    inputs:
      allow_d1_create:
        description: "Allow the plan to CREATE search D1 databases. Only for the first apply; otherwise a create means a database vanished (see infra/terraform/README.md)."
        type: boolean
        default: false

permissions:
  contents: read

# No workflow-level concurrency: GitHub keeps one running + one pending run per group and a new
# run cancels the pending one, which could drop a main apply. Concurrency is per job instead;
# HCP's state lock (-lock-timeout=5m) serialises state access across jobs.

env:
  TF_VERSION: "1.14.8"
  TF_DIR: infra/terraform/search-d1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  NODE_VERSION: "22"
  # "--allow-create" only from the manual first-apply dispatch input; empty otherwise.
  PLAN_GUARD_FLAGS: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_d1_create) && '--allow-create' || '' }}

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: terraform init (no backend)
        run: terraform -chdir="$TF_DIR" init -backend=false

      - name: terraform validate
        run: terraform -chdir="$TF_DIR" validate

  readiness:
    name: readiness (secrets + approval gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
      apply_protected: ${{ steps.environment.outputs.protected }}
    steps:
      - id: secrets
        name: Check Terraform secrets exist (and the apply token is not a repo secret)
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
          PLAN_TOKEN: ${{ secrets.TF_PLAN_CLOUDFLARE_API_TOKEN }}
          # This job has no environment, so this is non-empty only if the D1 Edit token was
          # created as a repo (or org) secret, where any PR branch could use it.
          APPLY_TOKEN_OUTSIDE_ENVIRONMENT: ${{ secrets.TF_APPLY_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$APPLY_TOKEN_OUTSIDE_ENVIRONMENT" ]; then
            echo "::error title=Terraform (search D1)::TF_APPLY_CLOUDFLARE_API_TOKEN is visible outside the cloudflare-production environment. Delete the repo/org secret and create it as an environment secret on cloudflare-production only."
            exit 1
          fi
          if [ -n "$TF_TOKEN_app_terraform_io" ] && [ -n "$PLAN_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Terraform (search D1)::Secrets not configured (TF_TOKEN_APP_TERRAFORM_IO, TF_PLAN_CLOUDFLARE_API_TOKEN). Plan and apply skipped. See infra/terraform/README.md."
          fi

      - id: environment
        name: Check apply environment requires approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          reviewers=$(gh api "repos/$REPO/environments/cloudflare-production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          if [ "${reviewers:-0}" -ge 1 ]; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Terraform (search D1)::Environment cloudflare-production missing or has no required reviewers. Apply will be skipped until it does."
          fi

  plan:
    name: plan + guard
    needs: [validate, readiness]
    if: needs.readiness.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # A newer push to the same PR supersedes an older PR plan. Main pushes and manual runs are
    # never cancelled (a cancel mid-plan could leave the HCP lock held, or drop the first-apply
    # dispatch), and the event name keeps a push and a dispatch on main in separate groups.
    concurrency:
      group: terraform-search-d1-plan-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      # D1 Read only: refresh + plan, cannot change or delete anything.
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_PLAN_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: HCP workspace exists with Execution Mode Local
        run: node infra/terraform/scripts/hcp-workspace-check.mjs "$TF_DIR/versions.tf"

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -lock-timeout=5m

      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -lock-timeout=5m -out=tfplan

      - name: Plan guard (no destroy / replace / unexpected create of D1 databases)
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          # shellcheck disable=SC2086 # PLAN_GUARD_FLAGS is empty or one flag
          node infra/terraform/scripts/plan-guard.mjs "$RUNNER_TEMP/plan.json" $PLAN_GUARD_FLAGS

      - name: Plan summary
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "<!-- terraform-search-d1-plan -->"
            echo "### Terraform plan (search D1) for \`${HEAD_SHA}\`"
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan 2>/dev/null | tail -c 60000 || echo "(no plan)"
            echo '```'
          } > "$RUNNER_TEMP/plan.md"
          cat "$RUNNER_TEMP/plan.md" >> "$GITHUB_STEP_SUMMARY"

      # One sticky comment per PR: edits the github-actions[bot] comment carrying the plan
      # marker (never another bot comment), or creates it. No stale plan to approve against.
      - name: Post plan to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node infra/terraform/scripts/sticky-plan-comment.mjs "$PR" "$RUNNER_TEMP/plan.md"

  apply:
    name: apply + migrations (approval required)
    needs: [plan, readiness]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.readiness.outputs.configured == 'true' &&
      needs.readiness.outputs.apply_protected == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    # Never cancel an apply. A newer main run may supersede a pending (not yet started) older
    # one, which is fine: it re-plans and `migrations apply` applies everything pending.
    concurrency:
      group: terraform-search-d1-apply
      cancel-in-progress: false
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      # D1 Edit, environment secret: only released after approval.
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_APPLY_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Apply token present in the environment
        run: |
          if [ -z "$TF_VAR_cloudflare_api_token" ]; then
            echo "::error title=Terraform (search D1)::TF_APPLY_CLOUDFLARE_API_TOKEN is not set as an environment secret on cloudflare-production."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: HCP workspace exists with Execution Mode Local
        run: node infra/terraform/scripts/hcp-workspace-check.mjs "$TF_DIR/versions.tf"

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -lock-timeout=5m

      # Re-plan after approval: state may have moved since the plan job ran.
      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -lock-timeout=5m -out=tfplan

      - name: Plan guard (no destroy / replace / unexpected create of D1 databases)
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          # shellcheck disable=SC2086 # PLAN_GUARD_FLAGS is empty or one flag
          node infra/terraform/scripts/plan-guard.mjs "$RUNNER_TEMP/plan.json" $PLAN_GUARD_FLAGS

      - name: terraform apply (guarded saved plan only)
        run: terraform -chdir="$TF_DIR" apply -lock-timeout=5m -input=false tfplan

      - name: Terraform outputs
        id: outputs
        run: terraform -chdir="$TF_DIR" output -json > "$RUNNER_TEMP/tf-outputs.json"

      - name: Install wrangler
        if: hashFiles('workers/search/migrations/*.sql') != ''
        run: npm ci

      # The migrations config is generated from Terraform outputs only (account id, names,
      # ids), so it works whether or not wrangler.search.jsonc still has placeholder ids.
      - name: D1 migrations (preview first, then production)
        if: hashFiles('workers/search/migrations/*.sql') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TF_APPLY_CLOUDFLARE_API_TOKEN }}
        run: |
          node infra/terraform/scripts/sync-wrangler-ids.mjs "$RUNNER_TEMP/tf-outputs.json" --migrations-config .wrangler.search-migrations.json
          npx wrangler d1 migrations apply cultpodcasts-search-preview --remote -c .wrangler.search-migrations.json
          npx wrangler d1 migrations apply cultpodcasts-search --remote -c .wrangler.search-migrations.json

      # Placeholders (before the sync PR) only warn; real ids that differ from Terraform fail:
      # the Worker would be bound to a database Terraform does not manage.
      - name: Check wrangler.search.jsonc ids
        if: always() && steps.outputs.outcome == 'success'
        run: |
          if [ ! -f wrangler.search.jsonc ]; then
            echo "wrangler.search.jsonc not on main yet (SP-1.1). Run sync-wrangler-ids.mjs once it lands." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp wrangler.search.jsonc "$RUNNER_TEMP/wrangler.search.jsonc"
          node infra/terraform/scripts/sync-wrangler-ids.mjs "$RUNNER_TEMP/tf-outputs.json" "$RUNNER_TEMP/wrangler.search.jsonc"
          if cmp -s wrangler.search.jsonc "$RUNNER_TEMP/wrangler.search.jsonc"; then
            echo "wrangler.search.jsonc matches the Terraform database ids." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '"database_id": *"PLACEHOLDER-' wrangler.search.jsonc; then
            echo "::warning title=wrangler.search.jsonc::Placeholder database ids. Open a PR running infra/terraform/scripts/sync-wrangler-ids.mjs."
            echo "wrangler.search.jsonc needs the Terraform ids (run sync-wrangler-ids.mjs in a PR)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=wrangler.search.jsonc::Database ids differ from Terraform outputs. The search Worker is bound to a database Terraform does not manage. Investigate before deploying; then sync with infra/terraform/scripts/sync-wrangler-ids.mjs."
            exit 1
          fi

  apply-skipped:
    name: apply skipped (approval gate not set up)
    needs: [plan, readiness]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.readiness.outputs.configured == 'true' &&
      needs.readiness.outputs.apply_protected != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning title=Terraform (search D1)::Apply skipped. Create environment cloudflare-production with a required reviewer, then re-run (workflow_dispatch)."
