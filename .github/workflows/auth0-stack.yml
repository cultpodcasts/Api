# Auth0 search-index write access: Terraform only, no dashboard clicks (cultpodcasts/Api#284).
#
# Jon, 17 Nov 2026: "You should have auth0 in terraform", "in tf". The write route
# POST /search/admin/docs (Api#281) needs the write:search-index permission, a Search Indexer role,
# a dedicated M2M app and its client grant in each Auth0 tenant. Staging and production are
# DIFFERENT tenants, so there are two roots and two HCP workspaces, mirroring the search stack:
#
#   PR (same-repo only)  PREVIEW: STAGING tenant, environment cloudflare-preview (no reviewers):
#                        plan -> guard -> sticky plan comment -> apply.
#   push to main         PRODUCTION: PROD tenant, environment cloudflare-production (Jon approves):
#                        plan -> guard -> apply, all inside the approved job.
#   manual run on main   As main (a rebuild from scratch, or re-applying after drift).
#
# There is no production plan on PRs: the only prod-tenant credentials are the Terraform
# management app's (read AND write scopes), and they live in cloudflare-production, which only
# main may use. The staging plan on the PR runs the same module. Deletes and replaces are refused
# by prevent_destroy and the plan guard (--stack=auth0) before any apply.
#
# No Api code deploy depends on this: the route is already live and answers 403 until the grant
# exists. Its caller (RPP SP-2.1) is configured from this stack's outputs after the apply.
#
# Credentials: TF_AUTH0_DOMAIN / TF_AUTH0_CLIENT_ID / TF_AUTH0_CLIENT_SECRET, ENVIRONMENT secrets on
# cloudflare-preview (staging tenant) and cloudflare-production (prod tenant), never repo secrets.
# The writer's own client secret exists only in HCP state: this workflow never runs
# `terraform output`, so it is never printed. Bootstrap: infra/terraform/README.md (Auth0).
name: Auth0 stack (Terraform)

on:
  pull_request:
    paths:
      - "infra/terraform/auth0/**"
      - "infra/terraform/modules/auth0-search-index-writer/**"
      - "infra/terraform/scripts/plan-guard.mjs"
      - "infra/terraform/scripts/hcp-workspace-check.mjs"
      - "infra/terraform/scripts/sticky-plan-comment.mjs"
      - ".github/workflows/auth0-stack.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/auth0/**"
      - "infra/terraform/modules/auth0-search-index-writer/**"
      - "infra/terraform/scripts/plan-guard.mjs"
      - "infra/terraform/scripts/hcp-workspace-check.mjs"
      - "infra/terraform/scripts/sticky-plan-comment.mjs"
      - ".github/workflows/auth0-stack.yml"
  # Manual run on main: a rebuild from scratch or a re-apply. Still behind the approval and the guard.
  workflow_dispatch:

permissions:
  contents: read

# Per-job concurrency, as in search-stack.yml: HCP's state lock (-lock-timeout=5m) serialises state.

env:
  TF_VERSION: "1.14.8"
  TF_DIR_PRODUCTION: infra/terraform/auth0/production
  TF_DIR_PREVIEW: infra/terraform/auth0/preview
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  NODE_VERSION: "22"

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: terraform init (no backend) + validate, both tenants
        run: |
          for dir in "$TF_DIR_PRODUCTION" "$TF_DIR_PREVIEW"; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  readiness:
    name: readiness (bootstrap secrets + environments)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: HCP token is a repo secret; the Auth0 management secrets are NOT
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
          # This job has no environment, so these are non-empty only if someone created them as
          # repo (or org) secrets, where any workflow on any branch could use them.
          DOMAIN_OUTSIDE_ENVIRONMENT: ${{ secrets.TF_AUTH0_DOMAIN }}
          CLIENT_ID_OUTSIDE_ENVIRONMENT: ${{ secrets.TF_AUTH0_CLIENT_ID }}
          CLIENT_SECRET_OUTSIDE_ENVIRONMENT: ${{ secrets.TF_AUTH0_CLIENT_SECRET }}
        run: |
          fail=0
          if [ -z "$TF_TOKEN_app_terraform_io" ]; then
            echo "::error title=Auth0 stack::Repo secret TF_TOKEN_APP_TERRAFORM_IO is missing (HCP Terraform org cultpodcasts). See infra/terraform/README.md, Auth0 bootstrap."
            fail=1
          fi
          if [ -n "$DOMAIN_OUTSIDE_ENVIRONMENT$CLIENT_ID_OUTSIDE_ENVIRONMENT$CLIENT_SECRET_OUTSIDE_ENVIRONMENT" ]; then
            echo "::error title=Auth0 stack::A TF_AUTH0_* secret is visible outside its environment. Delete the repo/org secret; create TF_AUTH0_DOMAIN, TF_AUTH0_CLIENT_ID and TF_AUTH0_CLIENT_SECRET as environment secrets on cloudflare-preview (staging tenant) and cloudflare-production (prod tenant) only."
            fail=1
          fi
          exit "$fail"

      - name: Environments exist, and production requires approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          fail=0
          # Checked before any job names it: a job naming a missing environment would CREATE it, unprotected.
          if ! gh api "repos/$REPO/environments/cloudflare-preview" --jq .name >/dev/null 2>&1; then
            echo "::error title=Auth0 stack::Environment cloudflare-preview does not exist. See infra/terraform/README.md, Auth0 bootstrap."
            fail=1
          fi
          reviewers=$(gh api "repos/$REPO/environments/cloudflare-production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "::error title=Auth0 stack::Environment cloudflare-production is missing or has no required reviewers; the prod tenant is never changed without Jon's approval."
            fail=1
          fi
          exit "$fail"

  preview:
    name: "preview (staging tenant): plan -> guard -> apply"
    needs: [validate, readiness]
    # Same-repo PRs only: fork PRs never get the environment secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    # One staging tenant: one apply at a time across all PRs, never cancelled mid-run (an apply cut
    # short could leave the HCP lock held). The last PR to apply wins.
    concurrency:
      group: auth0-stack-preview
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_DIR: infra/terraform/auth0/preview
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      # Staging tenant's Terraform management app, environment secrets on cloudflare-preview only.
      TF_VAR_auth0_domain: ${{ secrets.TF_AUTH0_DOMAIN }}
      TF_VAR_auth0_client_id: ${{ secrets.TF_AUTH0_CLIENT_ID }}
      TF_VAR_auth0_client_secret: ${{ secrets.TF_AUTH0_CLIENT_SECRET }}
    steps:
      - name: Auth0 bootstrap secrets present in cloudflare-preview (staging tenant)
        run: |
          missing=""
          [ -n "$TF_VAR_auth0_domain" ] || missing="$missing TF_AUTH0_DOMAIN"
          [ -n "$TF_VAR_auth0_client_id" ] || missing="$missing TF_AUTH0_CLIENT_ID"
          [ -n "$TF_VAR_auth0_client_secret" ] || missing="$missing TF_AUTH0_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error title=Auth0 stack::Missing environment secret(s) on cloudflare-preview:$missing (the STAGING tenant's Terraform management app). See infra/terraform/README.md, Auth0 bootstrap."
            exit 1
          fi
          case "$TF_VAR_auth0_domain" in
            */*) echo "::error title=Auth0 stack::TF_AUTH0_DOMAIN on cloudflare-preview must be a bare host name, without https:// or a path."; exit 1 ;;
            *.auth0.com) ;;
            *) echo "::error title=Auth0 stack::TF_AUTH0_DOMAIN on cloudflare-preview must be the canonical tenant domain (<tenant>.<region>.auth0.com, Tenant Settings), not the custom login domain."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: HCP workspace exists with Execution Mode Local
        run: node infra/terraform/scripts/hcp-workspace-check.mjs "$TF_DIR/versions.tf"

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -lock-timeout=5m

      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -lock-timeout=5m -out=tfplan

      - name: Plan guard (no destroy / replace of the Auth0 permission, role, client or grant)
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          node infra/terraform/scripts/plan-guard.mjs "$RUNNER_TEMP/plan.json" --stack=auth0
          rm -f "$RUNNER_TEMP/plan.json"

      # `terraform show` masks sensitive values (the writer's client secret is "(sensitive value)").
      - name: Plan summary
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "<!-- terraform-auth0-preview-plan -->"
            echo "### Terraform plan: Auth0 STAGING tenant for \`${HEAD_SHA}\` (the preview job applies this; production is planned and applied on main after approval)"
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan 2>/dev/null | tail -c 60000 || echo "(no plan)"
            echo '```'
          } > "$RUNNER_TEMP/plan.md"
          cat "$RUNNER_TEMP/plan.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post Auth0 preview plan to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node infra/terraform/scripts/sticky-plan-comment.mjs "$PR" "$RUNNER_TEMP/plan.md" "<!-- terraform-auth0-preview-plan -->"

      - name: terraform apply (guarded saved plan only)
        run: terraform -chdir="$TF_DIR" apply -lock-timeout=5m -input=false tfplan

  apply:
    name: "production (prod tenant): plan -> guard -> apply (approval required)"
    needs: [validate, readiness]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    # Never cancel an apply; a newer main run may supersede a pending (not yet approved) older one.
    concurrency:
      group: auth0-stack-production
      cancel-in-progress: false
    env:
      TF_DIR: infra/terraform/auth0/production
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      # Prod tenant's Terraform management app, environment secrets: released only after approval.
      TF_VAR_auth0_domain: ${{ secrets.TF_AUTH0_DOMAIN }}
      TF_VAR_auth0_client_id: ${{ secrets.TF_AUTH0_CLIENT_ID }}
      TF_VAR_auth0_client_secret: ${{ secrets.TF_AUTH0_CLIENT_SECRET }}
    steps:
      - name: Auth0 bootstrap secrets present in cloudflare-production (prod tenant)
        run: |
          missing=""
          [ -n "$TF_VAR_auth0_domain" ] || missing="$missing TF_AUTH0_DOMAIN"
          [ -n "$TF_VAR_auth0_client_id" ] || missing="$missing TF_AUTH0_CLIENT_ID"
          [ -n "$TF_VAR_auth0_client_secret" ] || missing="$missing TF_AUTH0_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error title=Auth0 stack::Missing environment secret(s) on cloudflare-production:$missing (the PROD tenant's Terraform management app). See infra/terraform/README.md, Auth0 bootstrap."
            exit 1
          fi
          case "$TF_VAR_auth0_domain" in
            */*) echo "::error title=Auth0 stack::TF_AUTH0_DOMAIN on cloudflare-production must be a bare host name, without https:// or a path."; exit 1 ;;
            *.auth0.com) ;;
            *) echo "::error title=Auth0 stack::TF_AUTH0_DOMAIN on cloudflare-production must be the canonical tenant domain (<tenant>.<region>.auth0.com, Tenant Settings), not the custom login domain."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: HCP workspace exists with Execution Mode Local
        run: node infra/terraform/scripts/hcp-workspace-check.mjs "$TF_DIR/versions.tf"

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -lock-timeout=5m

      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -lock-timeout=5m -out=tfplan

      - name: Plan guard (no destroy / replace of the Auth0 permission, role, client or grant)
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          node infra/terraform/scripts/plan-guard.mjs "$RUNNER_TEMP/plan.json" --stack=auth0
          rm -f "$RUNNER_TEMP/plan.json"

      - name: Plan summary
        if: always()
        run: |
          {
            echo "### Terraform plan: Auth0 PRODUCTION tenant for \`${GITHUB_SHA}\`"
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan 2>/dev/null | tail -c 60000 || echo "(no plan)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply (guarded saved plan only)
        run: terraform -chdir="$TF_DIR" apply -lock-timeout=5m -input=false tfplan
